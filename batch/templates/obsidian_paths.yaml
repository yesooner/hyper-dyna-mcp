# Obsidian vault paths for log backflow
# 请根据你的实际 Obsidian 知识库路径修改

obsidian:
  # Obsidian 知识库根目录
  # Windows 示例: "D:/Zotero/ZoteroNote"
  # macOS 示例: "/Users/username/Documents/ObsidianVault"
  root: "D:/Zotero/ZoteroNote"

  # 工作流日志文件路径
  workflow_log: "D:/Zotero/ZoteroNote/Agent/dyna mcp/workflow_log.md"

  # 执行日志文件路径
  execution_log: "D:/Zotero/ZoteroNote/Agent/dyna mcp/execution_log.md"

  # 验证日志文件路径
  validation_log: "D:/Zotero/ZoteroNote/Agent/dyna mcp/validation_log.md"

  # Handoff 日志目录
  handoff_dir: "D:/Zotero/ZoteroNote/Agent/dyna mcp/handoff"

  # 计划文档目录
  plan_dir: "D:/Zotero/ZoteroNote/Agent/dyna mcp/plan"
