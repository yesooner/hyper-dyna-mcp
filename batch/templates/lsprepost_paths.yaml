# LS-PrePost paths configuration
# 请根据你的实际安装路径修改

lsprepost:
  # LS-PrePost 可执行文件路径
  # Windows 默认: "C:/Program Files/LSTC/LS-PrePost4.9/lsprepost4.9_x64.exe"
  # 请根据你的实际版本修改版本号（如 4.8, 4.9）
  exe_path: "C:/Program Files/LSTC/LS-PrePost4.9/lsprepost4.9_x64.exe"

  # LS-PrePost 版本
  version: "4.9"

  # 默认超时时间（秒）
  default_timeout: 600

  # 输出目录（用于保存图像、动画等）
  output_dir: "F:/hyper-dyna-mcp/output"
